name: Delete old workflow runs

on:
  schedule:
    # 日本時間 00:15 に実行したい場合 (UTC 15:15)
    - cron: '15 15 * * *'
  workflow_dispatch:

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 100

name: Delete old workflow runs

on:
  schedule:
    - cron: '015 * * *' # 毎日　日本時間深夜0時に自動実行
  workflow_dispatch:    # ← ここ

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 100

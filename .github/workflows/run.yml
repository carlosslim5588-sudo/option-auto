name: Option Data
# 6:00JST（= 21:00 UTC）: 、16:00JST（= 07:00 UTC） のDATAが欲しい 2026/5/24現在朝1時間遅れ、夕方2時間遅れ
on:
  schedule:
# =========================
# 朝データ（6:00 JST（= 21:00 UTC）狙い → 遅延+1h吸収）
# =========================
    - cron: "08 20 * * *"  # 5:08 JST
    - cron: "08 21 * * *"  # 🇯🇵 日本時間の 朝6:08 に自動実行
# =========================
# 夕方データ（16:00 JST（= 07:00 UTC）狙い → 遅延+2h吸収）
# =========================
    - cron: "38 1 * * *"  # 10:38 JST
    - cron: "08 2 * * *"  # 11:08 JST
    - cron: "08 3 * * *"  # 12:08 JST
    - cron: "08 4 * * *"  # 13:08 JST
    - cron: "08 5 * * *"  # 14:08 JST
    - cron: "08 6 * * *"  # 15:08 JST
    
    - cron: "08 7 * * *"  # 🇯🇵 日本時間の 夕方16:08 に自動実行

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install selenium pandas openpyxl webdriver-manager lxml

      - name: Run script
        run: python Get_Option_Data.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: option-data
          path: Get_Option_Data_*.xlsx
          retention-days: 90  # 90日間保存する　書いた方が安定

name: Run Option Data

on:
  workflow_dispatch:

  schedule:
    - cron: '0 22 * * *'  # JST 07:00
    - cron: '0 7 * * *'   # JST 16:00

concurrency:
  group: option-data
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script (verbose)
        run: python -u Get_Option_Data.py
